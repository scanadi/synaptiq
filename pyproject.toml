[project]
name = "synaptiq"
version = "1.5.1"
description = "Graph-powered code intelligence engine — indexes codebases into a knowledge graph, exposed via MCP tools for AI agents and a CLI for developers."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Stevica Canadi", email = "stevica.canadi@gmail.com" }
]
keywords = ["code-intelligence", "knowledge-graph", "mcp", "tree-sitter", "static-analysis", "dead-code", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-go>=0.23.0",
    # LadybugDB: the actively-maintained KuzuDB successor (MIT). Replaced kuzu
    # entirely in W2.7 — see docs/plans/2026-07-12-storage-successor-evaluation.md.
    # API drop-in; floor-pinned to the evaluation-tested release with a <1.0
    # ceiling (live upstream, ~monthly cadence).
    "ladybug>=0.18.1,<1.0",
    "igraph>=1.0.0",
    "leidenalg>=0.11.0",
    "fastembed>=0.7.0",
    "mcp>=1.0.0",
    "watchfiles>=1.0.0",
    "pathspec>=1.0.4",
    # Arrow COPY FROM is the measured-fastest bulk-load path (W2.3); promoted from
    # the former `fast-load` extra into core so default installs get the speed.
    "pyarrow>=17.0.0",
]

[project.urls]
Homepage = "https://github.com/scanadi/synaptiq"
Repository = "https://github.com/scanadi/synaptiq"
Issues = "https://github.com/scanadi/synaptiq/issues"

[project.optional-dependencies]
neo4j = ["neo4j>=5.0.0"]
# Deprecated no-op alias: pyarrow (the Arrow COPY FROM bulk-load path) is now a
# core dependency, so `synaptiq[fast-load]` is redundant but kept so existing
# install commands / lockfiles don't break. See W2.3 / W4.1.
fast-load = []
# The "fast" embedding tier (`analyze --embedding-model fast`): model2vec static
# embeddings (minishlab/potion-base-8M, 256-dim) measured ~180x faster to encode
# than the default fastembed/ONNX "quality" tier, and the package pulls in only
# numpy + tokenizers + safetensors — no torch, no onnxruntime — so it stays an
# opt-in extra rather than a core dependency (W4.4).
fast-embeddings = ["model2vec>=0.8.0,<1.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
synaptiq = "synaptiq.cli.main:app"

[tool.uv.build-backend]
module-name = "synaptiq"


[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
    "equivalence_soak: 100-script incremental-equivalence soak (opt-in; excluded by default, run with '-m equivalence_soak')",
]
